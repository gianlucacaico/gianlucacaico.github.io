<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<title>T-shaped skill set</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="art.css">
<style>
  /* One T-shaped skill set (breadth across the top, depth down the stem)
     multiplied into the teammates around it. */
  .mesh{background:
    radial-gradient(36% 50% at 50% 30%, rgba(99,91,255,0.75), transparent 70%),
    radial-gradient(32% 46% at 16% 84%, rgba(235,93,118,0.5), transparent 70%),
    radial-gradient(30% 44% at 88% 80%, rgba(99,91,255,0.45), transparent 70%), #1B1446;}
  .bar{left:250px; top:120px; width:700px; height:76px; border-radius:20px; display:flex; align-items:center; justify-content:center; gap:10px; padding:0 18px;}
  .bar span{padding:9px 14px; border-radius:999px; font-size:14px; font-weight:700; color:#fff; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.22); white-space:nowrap;}
  .bar span.hi{background:#fff; color:var(--ink); border-color:#fff;}
  .stem{position:absolute; left:536px; top:196px; width:128px; height:330px; border-radius:0 0 20px 20px; overflow:hidden;
    background:linear-gradient(180deg, rgba(99,91,255,0.55), #635BFF 40%, #EB5D76);
    box-shadow:0 24px 50px rgba(235,93,118,0.35), inset 0 1px 0 rgba(255,255,255,0.3);}
  .stem i{position:absolute; left:16px; right:16px; height:0; border-top:1.5px solid rgba(255,255,255,0.28);}
  .stem b{position:absolute; left:0; right:0; top:20px; text-align:center; font-size:15px; font-weight:800; line-height:1.25; letter-spacing:-0.01em;}
  .cap{font-size:12px; font-weight:600; color:var(--muted-on-ink); letter-spacing:0.01em; white-space:nowrap;}
  .mate{width:132px; height:118px; border-radius:18px; display:flex; flex-direction:column; align-items:center; padding-top:16px;}
  .mate .av{width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.4); display:flex; align-items:center; justify-content:center;}
  .mini{position:relative; margin-top:12px; width:70px; height:50px;}
  .mini::before{content:''; position:absolute; left:0; right:0; top:0; height:12px; border-radius:5px; background:linear-gradient(100deg, #8D87FF, #EB5D76); opacity:var(--o);}
  .mini::after{content:''; position:absolute; left:28px; width:14px; top:12px; height:var(--d); border-radius:0 0 5px 5px; background:linear-gradient(180deg, #635BFF, #EB5D76); opacity:var(--o);}
</style>
</head>
<body data-kind="post">
<div class="canvas">
  <div class="mesh"></div>
  <div class="dots"></div>

  <svg class="abs" width="1200" height="630" style="left:0; top:0;">
    <g fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1.6" stroke-dasharray="4 6" stroke-linecap="round">
      <path d="M330 196 C330 260, 196 250, 196 316"/>
      <path d="M440 196 C440 300, 366 330, 366 420"/>
      <path d="M870 196 C870 260, 1004 250, 1004 316"/>
      <path d="M760 196 C760 300, 834 330, 834 420"/>
    </g>
    <g fill="#fff"><circle cx="330" cy="196" r="4"/><circle cx="440" cy="196" r="4"/><circle cx="870" cy="196" r="4"/><circle cx="760" cy="196" r="4"/></g>
  </svg>

  <span class="abs cap" style="left:250px; top:94px;">Breadth across disciplines</span>
  <div class="g bar">
    <span>Research</span><span>Content</span><span class="hi">Product</span><span class="hi">Facilitation</span><span>Strategy</span><span>AI</span>
  </div>
  <div class="stem">
    <b>Experience<br>design</b>
    <i style="top:110px"></i><i style="top:170px"></i><i style="top:230px"></i><i style="top:290px"></i>
  </div>
  <span class="abs cap" style="left:600px; top:540px; transform:translateX(-50%);">Depth in one craft</span>

  <div class="g mate" style="left:130px; top:316px;"><span class="av" id="a1"></span><span class="mini" style="--o:0.95; --d:34px"></span></div>
  <div class="g mate" style="left:300px; top:420px;"><span class="av"></span><span class="mini" style="--o:0.7; --d:22px"></span></div>
  <div class="g mate" style="left:938px; top:316px;"><span class="av"></span><span class="mini" style="--o:0.85; --d:28px"></span></div>
  <div class="g mate" style="left:768px; top:420px;"><span class="av"></span><span class="mini" style="--o:0.6; --d:16px"></span></div>
</div>
<script>
  document.querySelectorAll('.mate .av').forEach((a) => {
    a.innerHTML = '<svg width="18" height="18" viewBox="-9 -9 18 18" fill="#fff"><circle cy="-3" r="3.6"/><path d="M-7 8c0-4.5 3-6.5 7-6.5s7 2 7 6.5"/></svg>';
  });
</script>
</body>
</html>
