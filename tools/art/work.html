<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<title>Work link preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="art.css">
<style>
  /* Link preview for /work: the homepage card's layout, with a wall of case study cards
     in the Work page's industry colours instead of the portrait. */
  :root{
    --art-fs:radial-gradient(55% 75% at 20% 25%, rgba(99,91,255,0.95), transparent 70%), radial-gradient(50% 70% at 85% 80%, rgba(18,181,203,0.8), transparent 70%), #0A2540;
    --art-health:radial-gradient(55% 75% at 25% 30%, rgba(235,93,118,0.95), transparent 70%), radial-gradient(50% 70% at 85% 75%, rgba(255,166,89,0.8), transparent 70%), #3B1330;
    --art-energy:radial-gradient(55% 75% at 75% 25%, rgba(255,166,89,0.95), transparent 70%), radial-gradient(50% 70% at 20% 85%, rgba(235,93,118,0.6), transparent 70%), #13233F;
    --art-sport:radial-gradient(55% 75% at 25% 70%, rgba(18,181,203,0.9), transparent 70%), radial-gradient(50% 70% at 80% 20%, rgba(99,91,255,0.75), transparent 70%), #0B3B4A;
    --art-saas:radial-gradient(55% 75% at 70% 30%, rgba(99,91,255,0.9), transparent 70%), radial-gradient(50% 70% at 20% 80%, rgba(235,93,118,0.7), transparent 70%), #1B1446;
  }
  .mesh{background:
    radial-gradient(40% 50% at 12% 18%, rgba(99,91,255,0.22), transparent 70%),
    radial-gradient(36% 46% at 70% 8%, rgba(255,166,89,0.16), transparent 70%),
    radial-gradient(36% 46% at 90% 90%, rgba(235,93,118,0.12), transparent 70%);}
  .wc{position:absolute; width:236px; height:206px; border-radius:18px; overflow:hidden; background:#fff; border:1px solid var(--border); box-shadow:0 22px 44px rgba(10,37,64,0.14), 0 2px 6px rgba(10,37,64,0.05);}
  .wc .art{height:96px; background:var(--a); display:flex; align-items:flex-end; padding:12px;}
  .wc .art span{padding:5px 11px; border-radius:999px; font-size:11px; font-weight:700; color:#fff; background:linear-gradient(135deg, rgba(255,255,255,0.26), rgba(255,255,255,0.1)); border:1px solid rgba(255,255,255,0.34); box-shadow:inset 0 1px 0 rgba(255,255,255,0.4);}
  .wc .body{padding:14px 16px;}
  .wc .h{height:10px; width:78%; border-radius:5px; background:var(--ink);}
  .wc .o{margin-top:12px; padding-left:8px; border-left:2px solid var(--violet);}
  .wc .o i{display:block; height:7px; border-radius:4px; background:rgba(10,37,64,0.55);}
  .wc .o i + i{margin-top:6px; width:62%;}
  .wc .t{margin-top:14px; display:flex; gap:5px;}
  .wc .t i{height:14px; width:44px; border-radius:999px; background:var(--panel); border:1px solid var(--border);}
</style>
</head>
<body class="light" data-kind="share">
<div class="canvas">
  <div class="mesh"></div>

  <div class="card-copy">
    <p class="card-eyebrow">Work</p>
    <h1 class="card-name">Gianluca Caico</h1>
    <p class="card-sub">CX &amp; Experience Design Leader</p>
    <p class="card-line"><span class="grad">Outcomes</span> across the brands Australians use every week.</p>
  </div>
  <span class="card-url">gianlucacaico.com/work</span>

  <div id="wall"></div>
</div>
<script>
  // Two staggered columns of case study cards, running off the top and bottom edges.
  const cards = [
    [652, -150, 'sport', 'Sport'], [652, 74, 'fs', 'Financial services'], [652, 298, 'health', 'Health'], [652, 522, 'saas', 'SaaS'],
    [910, -40, 'saas', 'SaaS'], [910, 184, 'energy', 'Energy'], [910, 408, 'fs', 'Financial services'],
  ];
  document.getElementById('wall').innerHTML = cards.map(([x, y, a, chip]) =>
    `<div class="wc" style="left:${x}px; top:${y}px; --a:var(--art-${a})"><div class="art"><span>${chip}</span></div>
      <div class="body"><div class="h"></div><div class="o"><i></i><i></i></div><div class="t"><i></i><i></i><i></i></div></div></div>`).join('');
</script>
</body>
</html>
