<!DOCTYPE html>
<html lang="en-AU" class="work">
<head>
<meta charset="UTF-8">
<title>Generation Life</title>
<link rel="stylesheet" href="art.css">
<style>:root{--art:var(--art-fs);}</style>
</head>
<body data-kind="work">
<!-- Generation Life: agentic, evidence-led discovery with financial advisers. Conversations feed a traceable evidence layer, which resolves into a clean journey. -->
<div class="canvas">
  <div class="dots"></div>
  <div class="glow"></div>
  <svg class="abs" width="1040" height="400" viewBox="0 0 1040 400" style="left:0; top:0;">
    <g class="sh">
      <rect class="gl" x="404" y="146" width="156" height="56" rx="18"/>
      <path class="gl" d="M430 201 L422 218 L446 202Z"/>
      <circle cx="432" cy="174" r="12" fill="#12B5CB"/>
      <rect class="sk" x="454" y="164" width="88" height="8" rx="4"/><rect class="sk2" x="454" y="178" width="58" height="8" rx="4"/>
      <rect class="gl" x="456" y="222" width="156" height="56" rx="18"/>
      <circle cx="484" cy="250" r="12" fill="#8D87FF"/>
      <rect class="sk" x="506" y="240" width="88" height="8" rx="4"/><rect class="sk2" x="506" y="254" width="58" height="8" rx="4"/>
    </g>
    <path class="ln dash" d="M564 174 C640 174 650 140 724 140"/>
    <path class="ln dash" d="M616 250 C670 250 680 220 724 220"/>
    <g class="sh"><rect class="gl" x="724" y="50" width="280" height="300" rx="24"/></g>
    <g id="cells"></g>
    <g id="lineage" fill="none" stroke-width="2.5" stroke-linecap="round"></g>
    <path d="M768 296 H960" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round"/>
    <circle class="gl2" cx="768" cy="296" r="16"/><circle class="gl2" cx="832" cy="296" r="16"/><circle class="gl2" cx="896" cy="296" r="16"/>
    <circle class="wh" cx="960" cy="296" r="19"/>
    <path d="M951 296 l6 6 l12 -13" fill="none" stroke="#635BFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <script>
    let s = 5; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
    let h = '';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 7; c++) {
      const v = rnd(), f = v < 0.28 ? '#12B5CB' : v < 0.42 ? '#8D87FF' : v < 0.48 ? '#FFA659' : 'rgba(255,255,255,0.16)';
      h += `<rect x="${755 + c * 33}" y="${80 + r * 30}" width="21" height="21" rx="6" fill="${f}"/>`;
    }
    document.getElementById('cells').innerHTML = h;
    // Each journey step resolves to a claim above it.
    document.getElementById('lineage').innerHTML = [[0, 768, '#12B5CB'], [2, 832, '#8D87FF'], [4, 896, '#12B5CB'], [6, 960, '#12B5CB']].map(([c, nx, col]) => [755 + c * 33 + 10.5, nx, col])
      .map(([x, nx, col]) => `<path d="M${x} 191 C${x} 236, ${nx} 236, ${nx} 278" stroke="${col}" stroke-opacity="0.8"/>`).join('');
  </script>
</div>
</body>
</html>
