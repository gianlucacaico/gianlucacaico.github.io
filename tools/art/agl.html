<!DOCTYPE html>
<html lang="en-AU" class="work">
<head>
<meta charset="UTF-8">
<title>AGL</title>
<link rel="stylesheet" href="art.css">
<style>:root{--art:var(--art-energy);}</style>
</head>
<body data-kind="work">
<!-- AGL: login, authentication and CDR. Adaptive multi-factor sign-in (code, fingerprint, key) that balances usability, trust and risk. -->
<div class="canvas">
  <div class="dots"></div>
  <div class="glow"></div>
  <svg class="abs" width="1040" height="400" viewBox="0 0 1040 400" style="left:0; top:0;">
    <g class="sh">
      <g transform="translate(652 156)"><circle r="36" class="gl2"/>
        <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
          <path d="M-14 6 c0-12 6-20 14-20 s14 8 14 20"/><path d="M-8 12 c-1-4-1-8 0-12 c1-6 4-9 8-9 s7 3 8 9 c1 6 0 12 -2 16"/><path d="M0 -2 c0 8 0 14 -3 20"/>
        </g></g>
      <g transform="translate(640 262)"><circle r="30" class="gl"/>
        <g fill="none" stroke="#FFA659" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="-7" cy="0" r="8"/><path d="M1 0 H16 M11 0 V6 M16 0 V5"/></g></g>
    </g>
    <path class="ln dash" d="M690 160 C720 160 730 176 762 176" stroke-width="2.5"/>
    <path class="ln dash" d="M672 260 C710 260 726 244 762 244" stroke-width="2.5"/>
    <g class="sh"><rect class="gl2" x="760" y="28" width="196" height="344" rx="34"/></g>
    <rect x="772" y="40" width="172" height="320" rx="26" fill="rgba(10,37,64,0.38)"/>
    <rect x="828" y="50" width="60" height="10" rx="5" fill="rgba(255,255,255,0.25)"/>
    <path d="M858 84 L886 96 V118 C886 136 874 148 858 154 C842 148 830 136 830 118 V96Z" fill="#fff"/>
    <path d="M846 118 l8 8 l15 -16" fill="none" stroke="#FFA659" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="code"></g>
    <rect x="790" y="232" width="136" height="38" rx="19" fill="#FFA659"/><rect class="wh" x="830" y="247" width="56" height="8" rx="4"/>
    <rect class="sk2" x="806" y="292" width="104" height="8" rx="4"/><rect class="sk2" x="822" y="310" width="72" height="8" rx="4"/>
    <g transform="translate(952 46)"><circle r="20" fill="#12B5CB" stroke="#fff" stroke-width="3"/><path d="M-8 0 l5 5 l11 -11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  </svg>
  <script>
    // A one-time code being entered: four digits in, the fifth box waiting.
    document.getElementById('code').innerHTML = [0, 1, 2, 3, 4, 5].map((i) => {
      const x = 790 + i * 23;
      return `<rect x="${x}" y="176" width="19" height="30" rx="6" class="gl2"/>`
        + (i < 4 ? `<circle cx="${x + 9.5}" cy="191" r="4" fill="#fff"/>` : i === 4 ? `<rect x="${x + 8.5}" y="183" width="2.5" height="16" rx="1.2" fill="#FFA659"/>` : '');
    }).join('');
  </script>
</div>
</body>
</html>
