<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<title>Blog link preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="art.css">
<style>
  /* Link preview for /blog/: the homepage card's layout, with the posts' own artwork
     as a grid of post cards instead of the portrait. Render the posts first (tools/art.js does). */
  .mesh{background:
    radial-gradient(40% 50% at 12% 18%, rgba(99,91,255,0.22), transparent 70%),
    radial-gradient(36% 46% at 70% 8%, rgba(255,166,89,0.16), transparent 70%),
    radial-gradient(36% 46% at 90% 90%, rgba(235,93,118,0.12), transparent 70%);}
  .pc{position:absolute; width:240px; border-radius:16px; overflow:hidden; background:#fff; border:1px solid var(--border); box-shadow:0 22px 44px rgba(10,37,64,0.14), 0 2px 6px rgba(10,37,64,0.05);}
  .pc img{display:block; width:100%; aspect-ratio:1200/630; object-fit:cover;}
  .pc p{margin:0; padding:11px 14px 13px; font-size:13px; font-weight:700; line-height:1.3; letter-spacing:-0.01em; color:var(--ink);}
  .pc small{display:block; margin-bottom:3px; font-size:10.5px; font-weight:600; color:var(--faint); letter-spacing:0;}
</style>
</head>
<body class="light" data-kind="share">
<div class="canvas">
  <div class="mesh"></div>

  <div class="card-copy">
    <p class="card-eyebrow">Blog</p>
    <h1 class="card-name">Gianluca Caico</h1>
    <p class="card-sub">CX &amp; Experience Design Leader</p>
    <p class="card-line">Thinking on CX, experience design and <span class="grad">agentic delivery</span>.</p>
  </div>
  <span class="card-url">gianlucacaico.com/blog</span>

  <div class="pc" style="left:630px; top:78px;"><img src="/assets/img/blog/dynamic-blueprinting-sm.webp" alt=""><p><small>Service design</small>Dynamic blueprinting</p></div>
  <div class="pc" style="left:890px; top:118px;"><img src="/assets/img/blog/human-centred-transformation-sm.webp" alt=""><p><small>Transformation</small>Human-centred transformation</p></div>
  <div class="pc" style="left:630px; top:326px;"><img src="/assets/img/blog/t-shaped-skillset-sm.webp" alt=""><p><small>Leadership</small>Leveraging a T-shaped skill set</p></div>
  <div class="pc" style="left:890px; top:366px;"><img src="/assets/img/blog/video-games-ux-sm.webp" alt=""><p><small>UX</small>How video games use UX principles</p></div>
</div>
</body>
</html>
